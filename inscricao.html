<!DOCTYPE html>
<html style="background-color: black;" lang="pt-BR">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Página de inscrição para a seletiva da Batalha da Junção em Rio Grande, RS.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Libertinus+Keyboard&family=Orbitron:wght@400..900&family=Oxanium:wght@200..800&family=Press+Start+2P&family=Squada+One&display=swap"
        rel="stylesheet">
        <link rel="shortcut icon" href="img/batalhajuncaologo2.png" type="image/x-icon">
    <title>Inscrição para a Seletiva BDJ</title>

    <link rel="stylesheet" href="css/inscricao.css">

</head>

<body>

    <header>

        <img class="logo-principal" width="150" height="auto" src="img/batalha-juncao-logo.png"
            alt="Logo Batalha da Junção">

        <nav>
            <div>
                <a href="index.html" target="_self" rel="prev">Início</a>
                <b>|</b>
                <a href="informacoes.html" target="_parent" rel="next">Informação</a>
            </div>
        </nav>
    </header>

    <section id="formulario">

        <div>
            <h1>FORMULÁRIO DE INSCRIÇÃO</h1>
        </div>

        <div class="formulario">
            <div class="inscricao">
                <form method="get">

                    <div>
                        <label for="nome">

                            <p><b>1.</b> Nome completo: <b>*</b></p>

                            <input type="text" id="nome" name="nome" placeholder="Primeiro nome" required><br>
                            <input type="text" id="sobrenome" name="sobrenome" placeholder="Sobrenome" required>

                        </label>
                    </div>
                </form>

                <form method="get">
                    <div>
                        <label for="telefone">
                            <p><b>2. </b> Telefone: <b>*</b></p>
                            <input maxlength="11" type="text" id="telefone" name="telefone" placeholder="☏ (DDD)"
                                required>
                            <br>
                            <small><em>sem espaços</em></small>
                        </label>
                    </div>
                </form>

                <form method="get">
                    <div>
                        <label for="email">
                            <p><b>3. </b> Email: <b>*</b></p>
                            <input type="email" id="email" name="email" placeholder="exemplo@email.com" required>
                        </label>
                    </div>
                </form>
            </div>
        </div>
    </section>

    <section id="formulario-entrada">
        <div class="entrada">

            <form>
                <div>
                    <h1>MODO DE ENTRADA:</h1>
                </div>

                <img src="img/kant-mc-600.jpg" width="600" height="393" alt="Rapper e compositor Kant MC">

                <div>
                    <label>
                        
                        <input type="radio" name="entrada" required> Agasalho
                    
                    </label>

                    <label>
                        
                        <input type="radio" name="entrada" required> 1kg de alimento não perecível
                        
                    </label>
                </div>
            </form>
        </div>
    </section>


    <section id="interacao">
        <div class="opiniao">
            <h1>Relação com o rap</h1>
            <form>
                <label>
                    <p><b>4.</b> Se houver, descreve a tua relação com o rap.</p>

                    <textarea maxlength="120" rows="4" placeholder="O rap pra mim é..." required></textarea>
                </label>

                <br><br>

                <label>

                    <p><b>5.</b> Quem ou o que te aproximou do rap?</p>
                    <textarea maxlength="120" rows="4" placeholder="Eu conheci o rap..." required></textarea>

                </label>
            </form>
        </div>

        <br><br>

        <div>
            <button type="submit" value="confirmar">Confirmar</button>
        </div>
    </section>

    <footer>
        <section id="contato">
            <div class="contato">
                <div>
                    <a href="https://www.instagram.com/" target="_blank"><img src="img/icon/instagram-icone.png" width="40"
                            height="auto" alt="Logo do Instagram"></a>
                </div>
                <div>
                    <a href="https://www.youtube.com/" target="_blank"><img src="img/icon/youtube-icone.webp" width="40"
                            height="auto" alt="Logo do Youtube"></a>
                </div>
            </div>

            <div>
                <span><small>&copy; 2026 Lucca Menestrino. Todos os direitos reservados.</small></span>
            </div>
        </section>
    </footer>
</body>

</html>
